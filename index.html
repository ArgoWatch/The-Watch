<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0c0a08" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'none'; connect-src 'self' https://cloudflare-eth.com https://ethereum.publicnode.com https://ethereum-rpc.publicnode.com https://1rpc.io https://rpc.mevblocker.io https://eth.drpc.org https://rpc.flashbots.net; base-uri 'none'; form-action 'none'; object-src 'none'" />
  <title>The Watch — unofficial Argonauts player</title>
  <meta name="description" content="Unofficial fan player for on-chain Argonauts. Art and copyright stay with ACK / Muse Facktory." />
  <link rel="stylesheet" href="styles.css?v=58" />
</head>
<body>
  <div class="salon">
    <header class="mast">
      <button type="button" class="wordmark" id="wordmark" aria-label="Start of this path">The Watch</button>
      <div class="play-nav">
        <nav class="modes" aria-label="Mode">
          <button type="button" id="mode-watch" class="is-on" aria-pressed="false">Play</button>
          <button type="button" id="mode-apart" aria-pressed="false">Strip</button>
          <button type="button" id="mode-draw">Draw</button>
          <button type="button" id="btn-crew" aria-pressed="false">Crew</button>
        </nav>
        <nav class="paths" id="paths" aria-label="Path">
          <button type="button" data-path="fleet" class="is-on" aria-current="true">Fleet</button>
          <button type="button" data-path="unclothed">Unclothed</button>
          <button type="button" data-path="cloak">Cloak</button>
          <button type="button" data-path="relic">Relic</button>
          <button type="button" data-path="sight">Sight</button>
          <button type="button" data-path="artifact">Artifact</button>
          <button type="button" data-path="crown">Crown</button>
        </nav>
        <div class="crew" id="crew">
          <div class="crew-fields" id="crew-fields"></div>
        </div>
        <div class="path-strip" id="path-strip" hidden></div>
      </div>
      <button type="button" id="btn-sheet">Sheet</button>
    </header>

    <main class="stage-wrap" id="stage-wrap">
      <div id="stage" class="stage scale-16" aria-live="polite">
        <div id="pixel" class="pixel"></div>
        <div id="unminted" class="unminted" hidden>UNMINTED</div>
        <div id="veil" class="veil" hidden></div>
      </div>
      <ol id="plates" class="plates" hidden></ol>
      <div id="trait-stage" class="stage trait-stage" hidden>
        <div id="trait-pixel" class="pixel"></div>
        <div id="trait-empty" class="unminted" hidden>NONE</div>
      </div>
      <p id="caption" class="caption">ARGONAUT #0001</p>
      <p id="status" class="status" role="status"></p>

      <div class="controls" role="group" aria-label="Playback">
        <button type="button" id="btn-toggle" aria-label="Play">▶</button>
        <button type="button" id="btn-reset">Reset</button>
        <button type="button" id="btn-prev" aria-label="Previous">‹</button>
        <button type="button" id="btn-next" aria-label="Next">›</button>
        <label class="id-label">
          <span>id</span>
          <input id="id-input" type="text" inputmode="numeric" autocomplete="off" spellcheck="false" maxlength="4" value="1" aria-label="Argonaut id" />
        </label>
        <div class="speed" role="group" aria-label="Speed">
          <button type="button" class="speed-btn is-on" data-rate="0.5" aria-label="Half speed">½</button>
          <button type="button" class="speed-btn" data-rate="1" aria-label="One times">1</button>
          <button type="button" class="speed-btn" data-rate="2" aria-label="Two times">2</button>
        </div>
      </div>
    </main>

    <footer class="foot">
      Unofficial fan player. Art and copyright stay with ACK / Muse Facktory.
      <a href="https://argonauts.musefacktory.com" rel="noopener noreferrer">Harbor</a>
      <button type="button" class="colophon" id="renderer-colophon" aria-label="Renderer">
        <span class="colophon-short" id="renderer-mark"></span>
        <span class="colophon-full" id="renderer-full"></span>
      </button>
    </footer>
  </div>

  <script src="lib/chain.js?v=58"></script>
  <script src="lib/decode.js?v=58"></script>
  <script src="lib/family.js?v=58"></script>
  <script src="lib/paths.js?v=58"></script>
  <script src="lib/crew.js?v=58"></script>
  <script src="lib/playback.js?v=58"></script>
  <script src="lib/explode.js?v=58"></script>
  <script src="lib/draw.js?v=58"></script>
  <script src="lib/sheet.js?v=58"></script>
  <script src="app.js?v=58"></script>
</body>
</html>
